<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Rachit Stock Prediction</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="auth-wrap">
    <form class="card auth-card" id="form">
      <div class="bear-small" data-bear></div>
      <h1 style="text-align:center">Welcome back</h1>
      <p class="muted" style="text-align:center;margin-top:0">Log in to see your stock predictions</p>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="example@gmail.com" autocomplete="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <div class="error" id="error"></div>
      <button type="submit" style="width:100%;margin-top:8px">Log in</button>
      <p class="small" style="text-align:center">New here? <a href="/signup">Create an account</a></p>
      <div class="demo-hint">Demo account: <b>example@gmail.com</b> · password <b>123</b></div>
    </form>
  </div>
  <script src="/static/app.js"></script>
  <script>
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const error = document.getElementById("error");
      error.textContent = "";
      try {
        await api("/api/auth/login", { method: "POST", body: { email: byId("email").value, password: byId("password").value } });
        location.href = "/";
      } catch (err) { error.textContent = err.message; }
    };
  </script>
</body>
</html>
